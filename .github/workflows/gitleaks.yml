name: gitleaks

# Secret-scanning safety net for this PUBLIC repo. Runs on every push and PR,
# and on a weekly schedule to catch anything that slipped through.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays at 06:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: scan for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so gitleaks can scan all commits, not just the tip.
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          # No GITLEAKS_LICENSE is required for public repositories.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
