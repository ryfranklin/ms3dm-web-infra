# Pre-commit hooks for ms3dm-web-infra.
#
# Install once per clone:
#   pip install pre-commit   # or: brew install pre-commit
#   pre-commit install
#
# The gitleaks hook is the last line of defense against committing a secret to
# this PUBLIC repo. The Terraform hooks enforce the repo conventions (fmt,
# validate) from CLAUDE.md before a commit is created.

repos:
  # --- Secret scanning (primary safety net) --------------------------------
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks

  # --- Terraform hygiene ---------------------------------------------------
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.2
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  # --- General file hygiene ------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: mixed-line-ending
